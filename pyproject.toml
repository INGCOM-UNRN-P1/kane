[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kane"
version = "0.1.0"
description = "Simulador y depurador visual de I/O de bajo nivel y archivos binarios en C"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/kane"
Repository = "https://github.com/INGCOM-UNRN-P1/kane.git"
Issues = "https://github.com/INGCOM-UNRN-P1/kane/issues"

[project.scripts]
kane = "kane.cli:app"

[project.entry-points."ripley.plugins"]
binary_io = "kane.plugins.ripley_plugin:KanePlugin"

[dependency-groups]
# En `dependency-groups` (PEP 735) y no en `optional-dependencies`: uv instala
# este grupo con un `uv sync` a secas, de modo que el venv del repo queda listo
# para correr la suite. Como extra opcional había que acordarse de
# `--extra dev`, y sin eso `.venv/bin/python -m pytest` fallaba con
# "No module named pytest".
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]