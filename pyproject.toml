[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kane"
version = "0.1.0"
description = "Simulador y depurador visual de I/O de bajo nivel y archivos binarios en C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
kane = "kane.cli:app"

[project.entry-points."ripley.plugins"]
binary_io = "kane.plugins.ripley_plugin:KanePlugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
